# Port 80.
#
# Two jobs: serve the ACME challenge so a certificate can be issued at all, and
# serve the application. Once TLS is enabled (see README.md in this directory)
# everything except the challenge is redirected to 443.

upstream seo_agent_frontend {
  server frontend:3000;
}

upstream seo_agent_backend {
  server backend:8000;
}

# Shared proxy headers. X-Forwarded-Proto is what lets the application build
# correct absolute URLs — OAuth redirect URIs in particular — when it is behind
# a proxy terminating TLS.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

server {
  listen 80;
  server_name _;

  # Let's Encrypt writes its challenge here. This must stay reachable over
  # plain HTTP forever, including after the redirect below is switched on, or
  # renewal fails silently and the certificate expires.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # --- Enable after a certificate exists -----------------------------------
  # Uncomment these two lines and TLS becomes mandatory. Do it only once
  # `docker compose --profile tls run --rm certbot-issue` has succeeded,
  # otherwise the site redirects to a port with nothing listening on it.
  #
  # location / {
  #   return 301 https://$host$request_uri;
  # }
  # -------------------------------------------------------------------------

  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://seo_agent_backend;
  }

  location /docs {
    proxy_pass http://seo_agent_backend;
  }

  location /openapi.json {
    proxy_pass http://seo_agent_backend;
  }

  location /health {
    proxy_pass http://seo_agent_backend;
    access_log off;
  }

  location / {
    proxy_pass http://seo_agent_frontend;
  }
}
