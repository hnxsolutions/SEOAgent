services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: seo-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seoagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seoagent_password}
      POSTGRES_DB: ${POSTGRES_DB:-seoagent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - seo-agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seoagent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: seo-agent-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - seo-agent-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: seo-agent-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    networks:
      - seo-agent-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seo-agent-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-seoagent}:${POSTGRES_PASSWORD:-seoagent_password}@postgres:5432/${POSTGRES_DB:-seoagent}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      SEMANTIC_EMBEDDING_MODEL: ${SEMANTIC_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      SEMANTIC_EMBEDDING_DIMENSION: ${SEMANTIC_EMBEDDING_DIMENSION:-384}
      SEMANTIC_QDRANT_COLLECTION: ${SEMANTIC_QDRANT_COLLECTION:-seo_semantic_chunks}
    volumes:
      - ./backend:/app
      - /app/__pycache__
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - seo-agent-network
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Backend Worker (for async tasks - RQ)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seo-agent-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-seoagent}:${POSTGRES_PASSWORD:-seoagent_password}@postgres:5432/${POSTGRES_DB:-seoagent}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      SEMANTIC_EMBEDDING_MODEL: ${SEMANTIC_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      SEMANTIC_EMBEDDING_DIMENSION: ${SEMANTIC_EMBEDDING_DIMENSION:-384}
      SEMANTIC_QDRANT_COLLECTION: ${SEMANTIC_QDRANT_COLLECTION:-seo_semantic_chunks}
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - seo-agent-network
    command: >
      sh -c "rq worker --url redis://redis:6379 seo_queue_high seo_queue seo_queue_low --with-scheduler"
    healthcheck:
      disable: true

  # Optional production scheduler tick runner. Enable with:
  # docker compose --profile scheduler up -d scheduler
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seo-agent-scheduler
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-seoagent}:${POSTGRES_PASSWORD:-seoagent_password}@postgres:5432/${POSTGRES_DB:-seoagent}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      SEMANTIC_EMBEDDING_MODEL: ${SEMANTIC_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      SEMANTIC_EMBEDDING_DIMENSION: ${SEMANTIC_EMBEDDING_DIMENSION:-384}
      SEMANTIC_QDRANT_COLLECTION: ${SEMANTIC_QDRANT_COLLECTION:-seo_semantic_chunks}
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - seo-agent-network
    profiles:
      - scheduler
    command: >
      sh -c "while true; do python -m app.jobs.scheduler_tick --limit ${SCHEDULER_TICK_LIMIT:-50}; sleep ${SCHEDULER_INTERVAL_SECONDS:-3600}; done"
    restart: unless-stopped
    healthcheck:
      disable: true

  # Crawl Worker (for distributed crawling)
  crawl-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seo-agent-crawl-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-seoagent}:${POSTGRES_PASSWORD:-seoagent_password}@postgres:5432/${POSTGRES_DB:-seoagent}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      # Crawler-specific settings
      CRAWLER_MAX_CONCURRENT_PAGES: ${CRAWLER_MAX_CONCURRENT_PAGES:-5}
      CRAWLER_REQUEST_TIMEOUT: ${CRAWLER_REQUEST_TIMEOUT:-30}
      CRAWLER_RENDER_JAVASCRIPT: ${CRAWLER_RENDER_JAVASCRIPT:-true}
      CRAWLER_RESPECT_ROBOTS_TXT: ${CRAWLER_RESPECT_ROBOTS_TXT:-true}
      CRAWLER_RATE_LIMIT_RPS: ${CRAWLER_RATE_LIMIT_RPS:-2}
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - seo-agent-network
    command: >
      sh -c "python -m app.crawler.worker --workers 1 --queue default"
    healthcheck:
      disable: true
    deploy:
      replicas: ${CRAWL_WORKER_REPLICAS:-1}

  # Crawl Worker 2 (for parallel processing)
  crawl-worker-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seo-agent-crawl-worker-2
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-seoagent}:${POSTGRES_PASSWORD:-seoagent_password}@postgres:5432/${POSTGRES_DB:-seoagent}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      CRAWLER_MAX_CONCURRENT_PAGES: ${CRAWLER_MAX_CONCURRENT_PAGES:-5}
      CRAWLER_REQUEST_TIMEOUT: ${CRAWLER_REQUEST_TIMEOUT:-30}
      CRAWLER_RENDER_JAVASCRIPT: ${CRAWLER_RENDER_JAVASCRIPT:-true}
      CRAWLER_RESPECT_ROBOTS_TXT: ${CRAWLER_RESPECT_ROBOTS_TXT:-true}
      CRAWLER_RATE_LIMIT_RPS: ${CRAWLER_RATE_LIMIT_RPS:-2}
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - seo-agent-network
    command: >
      sh -c "python -m app.crawler.worker --workers 1 --queue default"
    profiles:
      - scaling

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: seo-agent-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - seo-agent-network
    command: node server.js
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: seo-agent-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    depends_on:
      - frontend
      - backend
    networks:
      - seo-agent-network
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
networks:
  seo-agent-network:
    driver: bridge
