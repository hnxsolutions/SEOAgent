# Development conveniences. Loaded AUTOMATICALLY by `docker compose up -d`.
#
# Everything unsafe for production lives here and nowhere else: source bind
# mounts, --reload, published database ports, and reaching Ollama on the host
# instead of running it as a service.
#
# To deploy, skip this file explicitly:
#
#   docker compose -f docker-compose.yml up -d
#
# Keep it that way round. When the safe configuration is the default, forgetting
# a flag gives you a slow deployment, not an exposed database.

services:
  # Published on loopback only. Even in development there is no reason for a
  # database to be reachable from the local network, and a laptop on a café
  # Wi-Fi is exactly where that goes wrong.
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  qdrant:
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"

  # A developer already has Ollama installed on the host with models pulled, so
  # running a second copy in a container would download another 1.9 GB to do the
  # same job. These two stay out of the way unless explicitly started.
  ollama:
    profiles:
      - container-ollama

  ollama-init:
    profiles:
      - container-ollama

  backend:
    environment:
      # Back to the host's Ollama. host.docker.internal:host-gateway is mapped
      # in the base file, so this also works on Linux.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      # Live code, so an edit is visible without a rebuild.
      - ./backend:/app
      # Anonymous volume so the container's bytecode cache does not land in the
      # working directory and confuse the host's interpreter.
      - /app/__pycache__
      # A website checkout for the repo agent to work on.
      #
      # READ-ONLY by default, and that default is the safety story: scanning and
      # patch generation only ever read, so nothing the agent does during them
      # can reach the site repository even if it tried.
      #
      # Applying patches writes - a branch, edited files, a commit - so it needs
      # write access. That is a deliberate, visible switch rather than a
      # permanent grant:
      #
      #   REPO_AGENT_MOUNT_MODE=rw docker compose up -d --force-recreate backend
      #
      # Set it back to ro (or just unset it) once the apply run is done. A mode
      # that has to be named each time cannot be forgotten into production the
      # way a commented-out ":ro" can.
      #
      # Point REPO_AGENT_MOUNT at whichever checkout you want worked on.
      - ${REPO_AGENT_MOUNT:-C:/Users/karan/hnx-solutions}:/repos/site:${REPO_AGENT_MOUNT_MODE:-ro}
      # Linux dependencies for the validation step, in their own volume.
      #
      # node_modules is not portable. A checkout installed on Windows contains
      # @next/swc-win32-x64-msvc and lightningcss-win32-x64-msvc, which a Linux
      # process cannot load, so `npm run build` fails here however healthy the
      # project is. Installing Linux builds into the host directory instead
      # would fix this container and break `npm run dev` on the host.
      #
      # This volume shadows that one directory for this container only. Each
      # side keeps the binaries for its own platform, and neither install can
      # overwrite the other. It is anonymous to the host filesystem, so nothing
      # here reaches the site repository.
      - repo_site_node_modules:/repos/site/node_modules
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # Proxy headers here too, so a developer running behind the nginx profile
    # sees the same redirect behaviour as production rather than discovering it
    # after deploying.
    # One line — see the note in docker-compose.yml about folded scalars and
    # more-indented continuation lines.
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips=*"

  worker:
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ./backend:/app
      - /app/__pycache__

  scheduler:
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ./backend:/app
      - /app/__pycache__

  crawl-worker:
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ./backend:/app
      - /app/__pycache__

  crawl-worker-2:
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ./backend:/app
      - /app/__pycache__

  frontend:
    build:
      args:
        # Development hits the backend directly rather than through nginx.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  # nginx is not wanted locally: the frontend and backend are already published
  # on their own ports, and binding 80 tends to collide with something else.
  nginx:
    profiles:
      - proxy

volumes:
  # Populated by installing from the target project's own package-lock.json.
  # Disposable: delete it and the next install rebuilds it.
  repo_site_node_modules:
    driver: local
